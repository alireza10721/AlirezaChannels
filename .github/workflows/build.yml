
name: Build APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          if [ ! -f source/settings.gradle.kts ]; then
            ROOT=$(find source -name settings.gradle.kts -print -quit | xargs -r dirname)
            if [ -n "$ROOT" ]; then
              shopt -s dotglob
              mv "$ROOT"/* source/
            fi
          fi

          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Build APK
        working-directory: source
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alireza-Channels-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
